# Workspace layout mirrors docs/planning/03-system-architecture.md §5.
packages:
  - backend/apps/*
  - backend/apps/workers/*
  - backend/modules/*
  - backend/contracts
  - backend/database
  - frontend/*
  - frontend/ide-extensions/*
  - runtime/*
  - shared/*

# One version per dependency for the whole monorepo (docs/planning/05 §3 rule 1).
# Packages reference these as `catalog:`, so an upgrade is a one-line change here
# and `pnpm install --frozen-lockfile` catches anything that drifts.
catalog:
  # Toolchain (Phase 1)
  '@biomejs/biome': 2.5.15
  '@types/node': 24.19.2
  turbo: 2.11.8
  typescript: 7.0.2
  vitest: 5.0.4
  zod: 4.6.7
  # Database (ADR-019 / ADR-020) — prisma CLI pinned to 7.10.0 explicitly:
  # `prisma@latest` is 8.0.0-rc, and it must match @prisma/client.
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.1
  '@types/pg': 8.23.1
  # API (ADR-018) — Fastify adapter, per docs/planning/05 §2.
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/platform-fastify': 12.1.3
  '@nestjs/testing': 12.1.3
  '@fastify/cookie': 11.1.3
  # Pinned to the version @nestjs/platform-fastify depends on exactly. Two copies
  # of fastify in the tree means two sets of types, and @fastify/cookie's plugin
  # type no longer matches the instance Nest hands to `register`.
  fastify: 5.12.5
  # Auth
  argon2: 0.45.1
  ulid: 3.0.2
  reflect-metadata: 0.2.2
  # Queue (ADR-005, docs/planning/15 §5). BullMQ brings its own ioredis; the
  # worker never imports ioredis directly, so it is not pinned here.
  bullmq: 6.3.16
  # Frontend (docs/planning/05 §4, 12 §2) — Next.js App Router, React 19,
  # Tailwind 4 with design tokens in `@ua/ui`.
  next: 16.4.1
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3

# Package build scripts may only run for these. Everything else stays unbuilt, so
# a compromised transitive dependency cannot execute code by adding a postinstall.
#
# `allowBuilds` is the pnpm 11+ spelling: `onlyBuiltDependencies` is silently
# ignored, so a workspace that still uses it runs every build script unapproved.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  # Argon2id password hashing (docs/planning/11 §5). Its install script is
  # `node-gyp-build`, which links the bundled N-API prebuild and only compiles
  # if none matches — no toolchain is needed for the platforms we ship.
  argon2: true
  msgpackr-extract: true
