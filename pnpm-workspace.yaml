# Workspace layout mirrors docs/planning/03-system-architecture.md §5.
packages:
  - backend/apps/*
  - backend/apps/workers/*
  - backend/modules/*
  - backend/contracts
  - backend/database
  - frontend/*
  - frontend/ide-extensions/*
  - runtime/*
  - shared/*

# One version per dependency for the whole monorepo (docs/planning/05 §3 rule 1).
# Packages reference these as `catalog:`, so an upgrade is a one-line change here
# and `pnpm install --frozen-lockfile` catches anything that drifts.
catalog:
  # Toolchain (Phase 1)
  '@biomejs/biome': 2.5.15
  '@types/node': 24.19.2
  turbo: 2.11.8
  typescript: 7.0.2
  vitest: 5.0.4
  zod: 4.6.7
  # Database (ADR-019 / ADR-020) — prisma CLI pinned to 7.10.0 explicitly:
  # `prisma@latest` is 8.0.0-rc, and it must match @prisma/client.
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.1
  '@types/pg': 8.23.1
  # API (ADR-018) — Fastify adapter, per docs/planning/05 §2.
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/platform-fastify': 12.1.3
  '@nestjs/testing': 12.1.3
  '@fastify/cookie': 11.1.3
  fastify: 5.12.7
  # Auth
  argon2: 0.45.1
  ulid: 3.0.2

# Package build scripts may only run for these. Everything else stays unbuilt, so
# a compromised transitive dependency cannot execute code by adding a postinstall.
#
# `allowBuilds` is the pnpm 11+ spelling: `onlyBuiltDependencies` is silently
# ignored, so a workspace that still uses it runs every build script unapproved.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
