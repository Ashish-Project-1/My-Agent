# CI baseline (docs/planning/17 Phase 1, `15` §7).
#
# Least privilege: this workflow only ever reads the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, OS-independent gates first: a leaked key or an unformatted file should
  # fail in seconds, not after a Windows matrix build.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/scan-secrets.mjs
      - run: node scripts/check-env-example.mjs

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # The Phase 1 exit criterion: build, typecheck and test from a clean checkout on
  # both operating systems. Windows is not a nice-to-have — the local runner is a
  # Windows service (docs/planning/09).
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test

  # The generated OpenAPI document is committed, so a schema change that was not
  # regenerated — and therefore an undocumented breaking change — fails here
  # (docs/planning/07 §7).
  contract:
    name: contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:openapi
      - name: fail if openapi.json is out of date
        run: git diff --exit-code -- backend/contracts/openapi.json

  # Phase 2's exit criterion: no query can reach another tenant's rows. It needs a
  # real PostgreSQL — Prisma's filters are only proved against the engine that
  # evaluates them — so it stays out of `verify` and runs here (docs/planning/17
  # Phase 2; the unit suite is deliberately database-free).
  integration:
    name: tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine3.24
        env:
          POSTGRES_USER: universal_agent
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U universal_agent -d universal_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway credential for the ephemeral service container, not a secret.
      DATABASE_URL: postgresql://universal_agent:postgres@localhost:5432/universal_agent # scan-secrets:allow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ua/database db:deploy
      - run: pnpm test:integration

  # Placeholder for the gates that arrive with the modules they check. Declared
  # now so the required-check list does not have to change later.
  #   e2e: needs Playwright browsers (Phase 7)
